<!doctype html>
<html lang="fr">

<head>

  <meta charset="utf-8">

  <meta name="description" content="Maison 3D interactive avec A-Frame">

  <meta name="keywords" content="Virtual Reality, A-Frame">

  <meta name="author" content="Olivier Nocent">

  <title>Maison 3D - A-Frame</title>


  <!-- ===================================================== -->
  <!-- A-FRAME -->
  <!-- ===================================================== -->

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- Système de physique -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

</head>


<body>


<a-scene physics="debug: false">


  <!-- ===================================================== -->
  <!-- RESSOURCES -->
  <!-- ===================================================== -->

  <a-assets>

    <img id="planche" src="assets/planche.png">
    <video
      id="video"
      src="assets/AiPigeon.mp4"
      autoplay
      loop
      muted
      playsinline
      preload="auto">
    </video>
  </a-assets>


  <!-- ===================================================== -->
  <!-- LUMIÈRES -->
  <!-- ===================================================== -->

  <!-- Plafonnier -->
  <a-box
    position="0 3 0"
    width="0.25"
    height="0.5"
    depth="0.25"
    color="white">
  </a-box>

  <a-sphere
    position="0 2.75 0"
    radius="0.1"
    color="#ffffaa">
  </a-sphere>

  <!-- effet de lumière ambiante -->

  <a-light
    type="ambient"
    color="#ffffff"
    intensity="0.75">
  </a-light>


  <a-light
    type="directional"
    position="-3 8 4"
    intensity="1.2"
    cast-shadow="true">
  </a-light>


  <!-- Lumière intérieure -->
  <a-light
    type="point"
    position="0 2 0"
    intensity="0.8"
    distance="12"
    color="#fff4dc">
  </a-light>


  <!-- ===================================================== -->
  <!-- CIEL -->
  <!-- ===================================================== -->

  <a-sky color="#87CEEB"></a-sky>


  <!-- ===================================================== -->
  <!-- SOL -->
  <!-- ===================================================== -->

  <a-plane
    position="0 0 0"
    rotation="-90 0 0"
    width="18"
    height="18"
    material="src: #planche; repeat: 5 5">
  </a-plane>



  <!-- ===================================================== -->
  <!-- ===================================================== -->
  <!--                    MURS DE LA MAISON                  -->
  <!-- ===================================================== -->
  <!-- ===================================================== -->


  <!-- ===================================================== -->
  <!-- MUR DU FOND : Z = -5 -->
  <!-- 2 FENÊTRES -->
  <!-- ===================================================== -->


  <!-- Partie basse -->
  <a-box
    position="0 0.45 -5"
    width="10"
    height="0.9"
    depth="0.3"
    color="#777777"
    static-body>
  </a-box>


  <!-- Partie haute -->
  <a-box
    position="0 2.75 -5"
    width="10"
    height="0.5"
    depth="0.3"
    color="#777777"
    static-body>
  </a-box>


  <!-- Mur gauche de la fenêtre 1 -->
  <a-box
    position="-3.775 1.7 -5"
    width="2.45"
    height="1.6"
    depth="0.3"
    color="#777777"
    static-body>
  </a-box>


  <!-- Entre fenêtre 1 et fenêtre 2 -->
  <a-box
    position="-0.3 1.7 -5"
    width="1.5"
    height="1.6"
    depth="0.3"
    color="#777777"
    static-body>
  </a-box>


  <!-- Mur droit de la fenêtre 2 -->
  <a-box
    position="3.475 1.7 -5"
    width="3.05"
    height="1.6"
    depth="0.3"
    color="#777777"
    static-body>
  </a-box>



  <!-- ===================================================== -->
  <!-- FENÊTRE 1 - MUR DU FOND -->
  <!-- ===================================================== -->

  <a-entity position="0 0 -0.25">

    <a-box
      position="-1.8 1.7 -4.75"
      width="1.58"
      height="1.52"
      depth="0.06"
      color="#8ed8ff"
      opacity="0.45"
      material="transparent: true">
    </a-box>


    <!-- Cadre gauche -->
    <a-box
      position="-2.57 1.7 -4.75"
      width="0.1"
      height="1.6"
      depth="0.15"
      color="#333333">
    </a-box>


    <!-- Cadre droit -->
    <a-box
      position="-1.03 1.7 -4.75"
      width="0.1"
      height="1.6"
      depth="0.15"
      color="#333333">
    </a-box>


    <!-- Cadre haut -->
    <a-box
      position="-1.8 2.48 -4.75"
      width="1.65"
      height="0.1"
      depth="0.15"
      color="#333333">
    </a-box>


    <!-- Cadre bas -->
    <a-box
      position="-1.8 0.92 -4.75"
      width="1.65"
      height="0.1"
      depth="0.15"
      color="#333333">
    </a-box>

    <!-- Séparation centrale -->
    <a-box
      position="-1.8 1.7 -4.75"
      width="0.07"
      height="1.5"
      depth="0.15"
      color="#333333">
    </a-box>

  </a-entity>

  <!-- ===================================================== -->
  <!-- FENÊTRE 2 - MUR DU FOND -->
  <!-- ===================================================== -->

  <a-entity position="0 0 -0.25">
    <a-box
      position="1.2 1.7 -4.75"
      width="1.5"
      height="1.52"
      depth="0.05"
      color="#8ed8ff"
      opacity="0.45"
      material="transparent: true">
    </a-box>


    <!-- Cadre gauche -->
    <a-box
      position="0.43 1.7 -4.75"
      width="0.1"
      height="1.6"
      depth="0.15"
      color="#333333">
    </a-box>


    <!-- Cadre droit -->
    <a-box
      position="1.97 1.7 -4.75"
      width="0.1"
      height="1.6"
      depth="0.15"
      color="#333333">
    </a-box>


    <!-- Cadre haut -->
    <a-box
      position="1.2 2.48 -4.75"
      width="1.65"
      height="0.1"
      depth="0.15"
      color="#333333">
    </a-box>


    <!-- Cadre bas -->
    <a-box
      position="1.2 0.92 -4.75"
      width="1.65"
      height="0.1"
      depth="0.15"
      color="#333333">
    </a-box>


    <!-- Séparation centrale -->
    <a-box
      position="1.2 1.7 -4.75"
      width="0.07"
      height="1.52"
      depth="0.15"
      color="#333333">
    </a-box>
  </a-entity>



  <!-- ===================================================== -->
  <!-- MUR GAUCHE : X = -5 -->
  <!-- 2 FENÊTRES -->
  <!-- ===================================================== -->


  <!-- Partie basse -->
  <a-box
    position="-5 0.45 0"
    width="10.3"
    height="0.9"
    depth="0.3"
    rotation="0 90 0"
    color="#777777"
    static-body>
  </a-box>


  <!-- Partie haute -->
  <a-box
    position="-5 2.75 0"
    width="10.3"
    height="0.5"
    depth="0.3"
    rotation="0 90 0"
    color="#777777"
    static-body>
  </a-box>


  <!-- Entre bord arrière et fenêtre 2 -->
  <a-box
    position="-5 1.7 -3.475"
    width="3.35"
    height="1.6"
    depth="0.3"
    rotation="0 90 0"
    color="#777777"
    static-body>
  </a-box>


  <!-- Entre fenêtre 2 et fenêtre 1 -->
  <a-box
    position="-5 1.7 0.625"
    width="1.75"
    height="1.6"
    depth="0.3"
    rotation="0 90 0"
    color="#777777"
    static-body>
  </a-box>


  <!-- Entre fenêtre 1 et bord avant -->
  <a-box
    position="-5 1.7 4.075"
    width="2.15"
    height="1.6"
    depth="0.3"
    rotation="0 90 0"
    color="#777777"
    static-body>
  </a-box>



  <!-- ===================================================== -->
  <!-- FENÊTRE GAUCHE 1 -->
  <!-- ===================================================== -->

  <a-entity position="-0.25 0 0">
    <!-- Ouverture : Z = 1.5 à 3 -->
    <a-box
      position="-4.75 1.7 2.25"
      width="0.05"
      height="1.52"
      depth="1.5"
      color="#8ed8ff"
      opacity="0.45"
      material="transparent: true">
    </a-box>


    <!-- Cadre avant -->
    <a-box
      position="-4.75 1.7 1.48"
      width="0.15"
      height="1.6"
      depth="0.1"
      color="#333333">
    </a-box>


    <!-- Cadre arrière -->
    <a-box
      position="-4.75 1.7 3.02"
      width="0.15"
      height="1.6"
      depth="0.1"
      color="#333333">
    </a-box>


    <!-- Cadre haut -->
    <a-box
      position="-4.75 2.48 2.25"
      width="0.15"
      height="0.1"
      depth="1.65"
      color="#333333">
    </a-box>


    <!-- Cadre bas -->
    <a-box
      position="-4.75 0.92 2.25"
      width="0.15"
      height="0.1"
      depth="1.65"
      color="#333333">
    </a-box>
  </a-entity>


  <!-- ===================================================== -->
  <!-- FENÊTRE GAUCHE 2 -->
  <!-- ===================================================== -->

  <a-entity position="-0.25 0 0">
    <!-- Ouverture : Z = -1.75 à -0.25 -->
    <a-box
      position="-4.75 1.7 -1"
      width="0.05"
      height="1.52"
      depth="1.5"
      color="#8ed8ff"
      opacity="0.45"
      material="transparent: true">
    </a-box>


    <!-- Cadre avant -->
    <a-box
      position="-4.75 1.7 -1.77"
      width="0.15"
      height="1.6"
      depth="0.1"
      color="#333333">
    </a-box>

    <!-- Cadre arrière -->
    <a-box
      position="-4.75 1.7 -0.23"
      width="0.15"
      height="1.6"
      depth="0.1"
      color="#333333">
    </a-box>

    <!-- Cadre haut -->
    <a-box
      position="-4.75 2.48 -1"
      width="0.15"
      height="0.1"
      depth="1.65"
      color="#333333">
    </a-box>


    <!-- Cadre bas -->
    <a-box
      position="-4.75 0.92 -1"
      width="0.15"
      height="0.1"
      depth="1.65"
      color="#333333">
    </a-box>
  </a-entity>


  <!-- ===================================================== -->
  <!-- MUR DROIT : X = 5 -->
  <!-- GRANDE FENÊTRE -->
  <!-- ===================================================== -->


  <!-- Partie basse -->
  <a-box
    position="5 0.45 0"
    width="10.3"
    height="0.9"
    depth="0.3"
    rotation="0 90 0"
    color="#777777"
    static-body>
  </a-box>


  <!-- Partie haute -->
  <a-box
    position="5 2.75 0"
    width="10.3"
    height="0.5"
    depth="0.3"
    rotation="0 90 0"
    color="#777777"
    static-body>
  </a-box>


  <!-- Partie arrière -->
  <a-box
    position="5 1.7 -3.575"
    width="3.15"
    height="1.6"
    depth="0.3"
    rotation="0 90 0"
    color="#777777"
    static-body>
  </a-box>


  <!-- Partie avant -->
  <a-box
    position="5 1.7 3.575"
    width="3.15"
    height="1.6"
    depth="0.3"
    rotation="0 90 0"
    color="#777777"
    static-body>
  </a-box>



  <!-- ===================================================== -->
  <!-- GRANDE FENÊTRE DROITE -->
  <!-- ===================================================== -->

  <a-entity position="0.25 0 0">
    <!-- Ouverture : Z = -2 à 2 -->
    <a-box
      position="4.75 1.7 0"
      width="0.05"
      height="1.52"
      depth="4"
      color="#8ed8ff"
      opacity="0.4"
      material="transparent: true">
    </a-box>


    <!-- Cadre arrière -->
    <a-box
      position="4.75 1.7 -2.02"
      width="0.15"
      height="1.6"
      depth="0.1"
      color="#333333">
    </a-box>


    <!-- Cadre avant -->
    <a-box
      position="4.75 1.7 2.02"
      width="0.15"
      height="1.6"
      depth="0.1"
      color="#333333">
    </a-box>


    <!-- Cadre haut -->
    <a-box
      position="4.75 2.48 0"
      width="0.15"
      height="0.1"
      depth="4.1"
      color="#333333">
    </a-box>


    <!-- Cadre bas -->
    <a-box
      position="4.75 0.92 0"
      width="0.15"
      height="0.1"
      depth="4.1"
      color="#333333">
    </a-box>


    <!-- Montant central -->
    <a-box
      position="4.75 1.7 0"
      width="0.15"
      height="1.6"
      depth="0.1"
      color="#333333">
    </a-box>
  </a-entity>


  <!-- ===================================================== -->
  <!-- MUR AVANT : Z = 5 -->
  <!-- PORTE -->
  <!-- ===================================================== -->


  <!-- Partie gauche -->
  <a-box
    position="-2.75 1.5 5"
    width="4.5"
    height="3"
    depth="0.3"
    color="#777777"
    static-body>
  </a-box>


  <!-- Partie droite -->
  <a-box
    position="3.25 1.5 5"
    width="3.5"
    height="3"
    depth="0.3"
    color="#777777"
    static-body>
  </a-box>


  <!-- Partie au-dessus de la porte -->
  <a-box
    position="0.5 2.75 5"
    width="2"
    height="0.5"
    depth="0.3"
    color="#777777"
    static-body>
  </a-box>



  <!-- ===================================================== -->
  <!-- CADRE DE PORTE -->
  <!-- ===================================================== -->

  <!-- Cadre gauche -->
  <a-box
    position="-0.5 1.25 5"
    width="0.15"
    height="2.5"
    depth="0.2"
    color="#333333">
  </a-box>


  <!-- Cadre droit -->
  <a-box
    position="1.5 1.25 5"
    width="0.15"
    height="2.5"
    depth="0.2"
    color="#333333">
  </a-box>

  <!-- Cadre du haut -->
  <a-box
    position="0.5 2.5 5"
    width="2.15"
    height="0.1"
    depth="0.2"
    color="#333333">
  </a-box>


  <!-- ===================================================== -->
  <!-- PORTE -->
  <!-- ===================================================== -->

  <!--
       Le pivot est placé au niveau du gond gauche.
       La porte est décalée de 0.9 m vers la droite.
  -->

  <a-entity
    id="door-hinge"
    position="-0.5 1.25 5">


    <!-- Porte -->
    <a-box
      id="door"
      class="clickable"
      position="1 0 0"
      width="2"
      height="2.5"
      depth="0.15"
      color="#632c09">
    </a-box>


    <!-- Poignée -->
    <a-cylinder
      id="door-handle"
      position="1.55 0 0"
      radius="0.07"
      height="0.3"
      rotation="90 0 0"
      color="#d4af37">
    </a-cylinder>


  </a-entity>



  <!-- ===================================================== -->
  <!-- TABLE -->
  <!-- ===================================================== -->

  <a-entity position="0 0 0.5">


    <!-- Plateau -->
    <a-box
      position="0 1 -1.4"
      width="2"
      height="0.15"
      depth="1"
      color="#8b4513">
    </a-box>


    <!-- Pied 1 -->
    <a-box
      position="-0.8 0.5 -1"
      width="0.15"
      height="1"
      depth="0.15"
      color="#5c3317">
    </a-box>


    <!-- Pied 2 -->
    <a-box
      position="0.8 0.5 -1"
      width="0.15"
      height="1"
      depth="0.15"
      color="#5c3317">
    </a-box>


    <!-- Pied 3 -->
    <a-box
      position="-0.8 0.5 -1.8"
      width="0.15"
      height="1"
      depth="0.15"
      color="#5c3317">
    </a-box>


    <!-- Pied 4 -->
    <a-box
      position="0.8 0.5 -1.8"
      width="0.15"
      height="1"
      depth="0.15"
      color="#5c3317">
    </a-box>


  </a-entity>



  <!-- ===================================================== -->
  <!-- CHAISE 1 -->
  <!-- ===================================================== -->

  <a-entity position="0 0 -0.3">


    <!-- Assise -->
    <a-box
      position="0 0.55 0"
      width="0.8"
      height="0.1"
      depth="0.8"
      color="#444444">
    </a-box>


    <!-- Dossier -->
    <a-box
      position="0 1 0.35"
      width="0.8"
      height="1"
      depth="0.1"
      color="#444444">
    </a-box>


    <!-- Pieds -->
    <a-box
      position="-0.3 0.25 -0.3"
      width="0.1"
      height="0.5"
      depth="0.1"
      color="#333333">
    </a-box>

    <a-box
      position="0.3 0.25 -0.3"
      width="0.1"
      height="0.5"
      depth="0.1"
      color="#333333">
    </a-box>

    <a-box
      position="-0.3 0.25 0.3"
      width="0.1"
      height="0.5"
      depth="0.1"
      color="#333333">
    </a-box>

    <a-box
      position="0.3 0.25 0.3"
      width="0.1"
      height="0.5"
      depth="0.1"
      color="#333333">
    </a-box>


  </a-entity>



  <!-- ===================================================== -->
  <!-- CHAISE 2 -->
  <!-- ===================================================== -->

  <a-entity
    position="0 0 -2"
    rotation="0 180 0">


    <a-box
      position="0 0.55 0"
      width="0.8"
      height="0.1"
      depth="0.8"
      color="#444444">
    </a-box>


    <a-box
      position="0 1 0.35"
      width="0.8"
      height="1"
      depth="0.1"
      color="#444444">
    </a-box>


    <a-box
      position="-0.3 0.25 -0.3"
      width="0.1"
      height="0.5"
      depth="0.1"
      color="#333333">
    </a-box>


    <a-box
      position="0.3 0.25 -0.3"
      width="0.1"
      height="0.5"
      depth="0.1"
      color="#333333">
    </a-box>


    <a-box
      position="-0.3 0.25 0.3"
      width="0.1"
      height="0.5"
      depth="0.1"
      color="#333333">
    </a-box>


    <a-box
      position="0.3 0.25 0.3"
      width="0.1"
      height="0.5"
      depth="0.1"
      color="#333333">
    </a-box>


  </a-entity>



  <!-- ===================================================== -->
  <!-- CANAPÉ -->
  <!-- ===================================================== -->

  <a-entity position="-2.5 -0.33 1.8" rotation="0 180 0">


    <!-- Assise -->
    <a-box
      position="0 0.6 0"
      width="2.5"
      height="0.5"
      depth="1"
      color="#355c7d">
    </a-box>


    <!-- Dossier -->
    <a-box
      position="0 1.3 0.4"
      width="2.5"
      height="1.2"
      depth="0.3"
      color="#355c7d">
    </a-box>


    <!-- Accoudoir gauche -->
    <a-box
      position="-1.1 1 0"
      width="0.3"
      height="0.9"
      depth="1"
      color="#355c7d">
    </a-box>


    <!-- Accoudoir droit -->
    <a-box
      position="1.1 1 0"
      width="0.3"
      height="0.9"
      depth="1"
      color="#355c7d">
    </a-box>


  </a-entity>



  <!-- ===================================================== -->
  <!-- TÉLÉVISION -->
  <!-- ===================================================== -->

  <a-box
    position="-2.5 1.7 4.55"
    width="2"
    height="1.2"
    depth="0.1"
    color="#111111">
  </a-box>

  <a-box
    position="-2.5 1.7 4.49"
    width="1.9"
    height="1.1"
    depth="0.01"
    material="src: #video; shader: flat">
  </a-box>

  <a-box
    position="-2.5 1 4.65"
    width="0.15"
    height="1.4"
    depth="0.15"
    color="#222222">
  </a-box>

  <!-- ===================================================== -->
  <!-- MEUBLE TV -->
  <!-- ===================================================== -->

  <a-box
    position="-2.5 0.5 4.5"
    width="3"
    height="0.7"
    depth="0.5"
    color="#5c3317">
  </a-box>



  <!-- ===================================================== -->
  <!-- PLANTE -->
  <!-- ===================================================== -->

  <a-entity position="4.5 0 -4.5" rotation="0 -45 0">


    <!-- Pot -->
    <a-cylinder
      position="0 0.33 1"
      radius="0.35"
      height="0.7"
      color="#b5651d">
    </a-cylinder>


    <!-- Tige -->
    <a-cylinder
      position="0 1.3 1"
      radius="0.06"
      height="1.5"
      color="#27632a">
    </a-cylinder>


    <!-- Feuilles -->
    <a-sphere
      position="0.4 1.7 1"
      radius="0.45"
      color="#2e8b57">
    </a-sphere>


    <a-sphere
      position="-0.3 1.8 1"
      radius="0.45"
      color="#2e8b57">
    </a-sphere>


    <a-sphere
      position="0 2.1 1"
      radius="0.5"
      color="#228b22">
    </a-sphere>


  </a-entity>


  <!-- ===================================================== -->
  <!-- AQUARIUM -->
  <!-- ===================================================== -->

  <a-entity id="aquarium" position="3 0 4">

    <!-- =================================================== -->
    <!-- MEUBLE -->
    <!-- =================================================== -->

    <!-- Plateau -->
    <a-box
      position="0 0.95 0"
      width="3.4"
      height="0.2"
      depth="1.3"
      color="#5c3317">
    </a-box>

    <!-- Meuble -->
    <a-box
      position="0 0.45 0"
      width="3"
      height="0.8"
      depth="1.1"
      color="#704214">
    </a-box>

    <!-- Portes du meuble -->
    <a-box
      position="-0.7 0.45 -0.57"
      width="1.1"
      height="0.6"
      depth="0.04"
      color="#5a3216">
    </a-box>

    <a-box
      position="0.7 0.45 -0.57"
      width="1.1"
      height="0.6"

<!-- JAVASCRIPT -->
<!-- ===================================================== -->

<script>


const doorHinge = document.querySelector("#door-hinge");

const door = document.querySelector("#door");

const handle = document.querySelector("#door-handle");

const video = document.querySelector("#video");

document.querySelector("a-scene").addEventListener("loaded", function () {

  video.play().catch(function () {});

});


let doorOpen = false;

let doorAnimating = false;



/* ==========================================================
   OUVERTURE / FERMETURE DE LA PORTE
   ========================================================== */

door.addEventListener("click", function () {


  /* Empêche les clics multiples pendant l'animation */

  if (doorAnimating) return;


  doorAnimating = true;


  if (!doorOpen) {


    /* ------------------------------------------------------
       OUVERTURE
       ------------------------------------------------------ */

    doorHinge.setAttribute("animation", {

      property: "rotation",

      to: "0 -90 0",

      dur: 1200,

      easing: "easeInOutCubic"

    });


    /* Rotation de la poignée */

    handle.setAttribute("animation", {

      property: "rotation",

      to: "90 0 25",

      dur: 250,

      easing: "easeOutQuad"

    });


    doorOpen = true;


  } else {


    /* ------------------------------------------------------
       FERMETURE
       ------------------------------------------------------ */

    doorHinge.setAttribute("animation", {

      property: "rotation",

      to: "0 0 0",

      dur: 1200,

      easing: "easeInOutCubic"

    });


    handle.setAttribute("animation", {

      property: "rotation",

      to: "90 0 0",

      dur: 250,

      easing: "easeOutQuad"

    });


    doorOpen = false;

  }


  /* Fin de l'animation */

  setTimeout(function () {

    doorAnimating = false;

  }, 1200);


});



/* ==========================================================
   EFFET DE SURVOL DE LA PORTE
   ========================================================== */

door.addEventListener("mouseenter", function () {


  door.setAttribute("animation__hover", {

    property: "scale",

    to: "1.02 1.02 1.02",

    dur: 200,

    easing: "easeOutQuad"

  });


});


door.addEventListener("mouseleave", function () {


  door.setAttribute("animation__hover", {

    property: "scale",

    to: "1 1 1",

    dur: 200,

    easing: "easeOutQuad"

  });


});


</script>
